<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13201A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Defensoria">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Autos da Defensoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: app de estudo com barra lateral (vira faixa no celular). Mesma família visual da Biblioteca D'Ávila: verde-tinta, latão, Bodoni nos números. Cada dia é uma "folha" dos autos com os itens em ordem de horário. */
:root{
  --paper:#F1F3EE; --card:#FAFBF7; --ink:#17201B; --muted:#5D6962; --faint:#8C978F; --rule:#D6DCD4;
  --accent:#1D5A43; --accent-ink:#F4F8F4; --accent-soft:#DCEAE2; --brass:#946E1F; --brass-soft:#EDE3CC;
  --side:#13201A; --side-ink:#DCE5DF; --side-muted:#8FA198; --side-hi:#22362C;
  --ok:#2F7A52; --bad:#A6402F; --warn:#9A6A12;
  --m-inst:#1D5A43; --m-dh:#6E3F78; --m-const:#2F5A8A; --m-adm:#8A6A14; --m-pen:#8A3A2C; --m-civ:#2D6B60; --m-eca:#9A4F6A; --m-filo:#4E5A70; --m-mix:#5D6962;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 0 rgba(20,30,25,.05),0 8px 24px -14px rgba(20,30,25,.3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1411; --card:#151D19; --ink:#E3E8E1; --muted:#97A49B; --faint:#6C786F; --rule:#27322C;
  --accent:#67BE96; --accent-ink:#0B1410; --accent-soft:#18291F; --brass:#D4AC57; --brass-soft:#2B2618;
  --side:#0A0F0C; --side-ink:#DCE5DF; --side-muted:#7F9187; --side-hi:#18241E;
  --ok:#6CC08F; --bad:#E58A79; --warn:#E0B060;
  --m-inst:#67BE96; --m-dh:#C08ACB; --m-const:#7FB0E0; --m-adm:#D9B95C; --m-pen:#E08B77; --m-civ:#6FC2B2; --m-eca:#E596B4; --m-filo:#A3B0C8; --m-mix:#97A49B;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1411; --card:#151D19; --ink:#E3E8E1; --muted:#97A49B; --faint:#6C786F; --rule:#27322C;
  --accent:#67BE96; --accent-ink:#0B1410; --accent-soft:#18291F; --brass:#D4AC57; --brass-soft:#2B2618;
  --side:#0A0F0C; --side-ink:#DCE5DF; --side-muted:#7F9187; --side-hi:#18241E;
  --ok:#6CC08F; --bad:#E58A79; --warn:#E0B060;
  --m-inst:#67BE96; --m-dh:#C08ACB; --m-const:#7FB0E0; --m-adm:#D9B95C; --m-pen:#E08B77; --m-civ:#6FC2B2; --m-eca:#E596B4; --m-filo:#A3B0C8; --m-mix:#97A49B;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.k{font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
a{color:var(--accent)}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px}
.brand .ex{font:500 10px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.brand h1{font:700 24px/1.05 var(--f-display);margin-top:6px}
.brand h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font:500 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:var(--side-hi)}
.nav a[aria-current="page"]{background:var(--side-hi);color:#fff;box-shadow:inset 3px 0 0 var(--brass)}
.nav svg{width:16px;height:16px;flex:none;opacity:.8}
.nav .badge{margin-left:auto;font:500 11px var(--f-mono);background:var(--brass);color:#1a1405;border-radius:999px;padding:1px 7px}
.side .foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--side-hi);font-size:12.5px;color:var(--side-muted)}
.side .foot b{display:block;font:700 30px/1 var(--f-display);color:#fff;margin-bottom:2px}
.main{min-width:0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:26px 80px}
.view{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;z-index:20;flex-direction:row;align-items:center;padding:10px max(12px,env(safe-area-inset-left,0px));gap:10px;overflow-x:auto;overflow-y:hidden;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .brand{display:none}.side .foot{display:none}
  .nav{flex-direction:row;gap:4px}.nav .grp{display:none}
  .nav a{white-space:nowrap;padding:7px 10px;font-size:13px}
  .nav a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--brass)}
  .main{padding-block:18px 80px}
}

/* generic */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.head h2{font:700 clamp(28px,4.4vw,42px)/1.05 var(--f-display)}
.head p{color:var(--muted);margin-top:6px;max-width:62ch}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;min-width:0}
.panel h3{font:600 16px/1.3 var(--f-ui)}
.panel .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat .v{font:700 34px/1.05 var(--f-display);font-variant-numeric:lining-nums tabular-nums;margin-top:6px}
.stat .s{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;line-height:1.2}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.brass{background:var(--brass);color:#1a1405;border-color:var(--brass)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 11.5px var(--f-mono);padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.dotm{width:9px;height:9px;border-radius:50%;background:var(--mc,var(--m-mix));flex:none;display:inline-block}
.muted{color:var(--muted)}
.empty{border:1px dashed var(--rule);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:700 19px var(--f-display);margin-bottom:4px}
.note{font-size:13px;color:var(--muted)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
textarea.inp{min-height:160px;resize:vertical;line-height:1.55}
select.inp{width:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.conn{font-size:12.5px;color:var(--muted)}

/* início */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hello h2{font:700 clamp(30px,5vw,46px)/1.05 var(--f-display)}
.hello h2 em{font-style:italic;font-weight:500;color:var(--accent)}
.hello .date{color:var(--muted);margin-top:6px}
.flip{display:flex;gap:6px;align-items:flex-end;margin-top:10px;flex-wrap:wrap}
.flip span{font:700 40px/1 var(--f-display);background:var(--ink);color:var(--paper);padding:8px 10px;border-radius:6px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums lining-nums}
.flip small{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-left:6px;align-self:center}
.next3{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mini{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.mini:last-child{border-bottom:0}
.mini .h{font:500 12px var(--f-mono);color:var(--muted)}
.mini .t{font-weight:600;min-width:0}
.mini .t small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--rule);border-radius:8px;padding:8px;background:var(--paper);min-width:0;text-align:left}
.wd.today{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.wd .n{font:500 11px var(--f-mono);color:var(--muted)}
.wd .d{font:700 20px var(--f-display)}
.wd .chips{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.wd .chips i{width:8px;height:8px;border-radius:2px;background:var(--mc)}
.wd .bar{height:3px;background:var(--rule);border-radius:2px;margin-top:6px;overflow:hidden}
.wd .bar b{display:block;height:100%;background:var(--accent)}

/* hoje */
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daynav .x{border:1px solid var(--rule);background:var(--card);border-radius:8px;width:36px;height:36px;display:grid;place-items:center}
.daytitle{font:700 clamp(26px,4vw,38px)/1.1 var(--f-display)}
.dayprog{display:flex;align-items:center;gap:12px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--rule) 0);display:grid;place-items:center;flex:none}
.ring span{width:46px;height:46px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:600 13px var(--f-mono)}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--mc,var(--rule));border-radius:10px;padding:14px 16px}
.item.done{opacity:.72}
.item.done .it-title{text-decoration:line-through;text-decoration-color:var(--faint)}
.item .hr{font:500 12.5px var(--f-mono);color:var(--muted);padding-top:2px}
.item .hr small{display:block;font-size:11px;color:var(--faint)}
.it-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.it-tag{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mc,var(--muted))}
.it-title{font:600 16.5px/1.3 var(--f-ui);margin-top:2px}
.it-body{margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.it-body .ln{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.it-body .ln b{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:3px}
.chk{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:999px;padding:5px 12px 5px 8px;background:var(--paper);font-size:13px;font-weight:600}
.chk input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.it-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prompt{font:13px/1.5 var(--f-mono);background:var(--paper);border:1px dashed var(--rule);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr)}.item .hr{display:flex;gap:8px}.it-body .ln{grid-template-columns:minmax(0,1fr)}}

/* quiz */
.quiz{margin-top:12px;border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:14px}
.q{display:flex;flex-direction:column;gap:8px}
.q .en{font-weight:600}
.q .en small{font:500 11px var(--f-mono);color:var(--muted);display:block;margin-bottom:2px}
.alt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.45}
.alt b{font:600 13px var(--f-mono)}
.alt:hover{border-color:var(--faint)}
.alt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.alt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--paper))}
.alt[disabled]{cursor:default}
.expl{font-size:13.5px;border-left:3px solid var(--brass);padding:4px 0 4px 10px;color:var(--ink)}
.expl b{font:500 11px var(--f-mono);color:var(--brass);text-transform:uppercase;letter-spacing:.08em}
.score{font:700 22px var(--f-display)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.spin{width:16px;height:16px;border:2px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.out{white-space:pre-wrap;font-size:14.5px;line-height:1.6;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}

/* cronograma */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .hd{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;text-align:center;padding:4px 0}
.cday{min-height:96px;border:1px solid var(--rule);border-radius:8px;padding:7px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.cday.out{opacity:.35}
.cday.today{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.cday.off{background:var(--paper)}
.cday .n{font:600 13px var(--f-mono);display:flex;justify-content:space-between}
.cday .n i{font-style:normal;color:var(--ok)}
.cday .lab{font-size:11.5px;line-height:1.25;display:flex;gap:5px;align-items:flex-start;min-width:0}
.cday .lab span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cday .lab .dotm{margin-top:3px;width:7px;height:7px}
.cday .ev{font:500 10.5px var(--f-mono);color:var(--bad)}
@media (max-width:640px){.cday{min-height:62px;padding:5px}.cday .lab span{display:none}.cday .lab{display:inline-flex}.cday .labs{display:flex;gap:3px;flex-wrap:wrap}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.phasebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.phasebar div{padding:10px 12px;border-right:1px solid var(--rule);min-width:0}
.phasebar div:last-child{border-right:0}
.phasebar .now{background:var(--accent-soft)}
.phasebar b{display:block;font:700 16px var(--f-display)}
.phasebar small{color:var(--muted);font-size:12px}
@media (max-width:640px){.phasebar{grid-template-columns:repeat(2,minmax(0,1fr))}.phasebar div:nth-child(2){border-right:0}.phasebar div:nth-child(-n+2){border-bottom:1px solid var(--rule)}}

/* edital */
.mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.mat{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--mc);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.mat header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mat .pct{font:500 12px var(--f-mono);color:var(--muted)}
.prog{height:5px;background:var(--rule);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mc);width:0}
.tchk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.35;cursor:pointer}
.tchk input{margin-top:2px;accent-color:var(--accent)}
.tchk.done span{color:var(--muted);text-decoration:line-through}

/* desempenho */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13.5px}
.bar .tr{height:14px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--mc)}
.bar .n{font:500 12px var(--f-mono);text-align:right;color:var(--muted)}
@media (max-width:520px){.bar{grid-template-columns:100px minmax(0,1fr) 70px;font-size:12px}}
.heat{display:grid;grid-template-columns:repeat(auto-fill,12px);gap:3px}
.heat i{width:12px;height:12px;border-radius:2px;background:var(--rule)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--rule))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--rule))}
.heat i.l3{background:var(--accent)}

/* erros */
.err{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--mc);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.err .meta{font:500 11.5px var(--f-mono);color:var(--muted)}

/* timer */
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer .tv{font:700 28px var(--f-display);font-variant-numeric:tabular-nums lining-nums;min-width:4.2ch}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--paper)}
.alvos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.alvo{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.alvo.prio{border:2px solid var(--accent)}
.alvo .sal{font:700 30px var(--f-display)}
.alvo dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13.5px}
.alvo dt{font:500 11px var(--f-mono);color:var(--muted);padding-top:2px}
.alvo dd{margin:0}

function statsPorMat(){

  for(const s in DIAS){const q=DIAS[s].q||{};for(const m in q)add(m,q[m].f,q[m].a);const g=DIAS[s].reg||{};for(const k in g)add(g[k].m,g[k].f,g[k].a)}return r;

let timer={run:false,t0:0,acc:0,iv:null,dia:null};
function bindTimer(s){
  const tv=document.getElementById("tv");const upd=()=>{const ms=timer.acc+(timer.run?Date.now()-timer.t0:0);const m=Math.floor(ms/6e4),sec=Math.floor(ms/1e3)%60;tv.textContent=pad(m)+":"+pad(sec)};
  clearInterval(timer.iv);timer.iv=setInterval(upd,1000);upd();
  document.getElementById("tStart").onclick=()=>{if(!timer.run){timer.run=true;timer.t0=Date.now();timer.dia=s;upd()}};
  document.getElementById("tPause").onclick=()=>{if(timer.run){timer.acc+=Date.now()-timer.t0;timer.run=false;upd()}};
  document.getElementById("tSave").onclick=()=>{const ms=timer.acc+(timer.run?Date.now()-timer.t0:0);const m=Math.round(ms/6e4);if(m<1){toast("Menos de 1 minuto: nada para salvar.");return}
    saveDia(s,c=>{c.min=(c.min||0)+m});timer={run:false,t0:0,acc:0,iv:timer.iv,dia:null};upd();toast(m+" minutos salvos em "+fmtShort(s));const el=document.getElementById("minHoje");if(el)el.textContent=(DIAS[s].min||0)+" min registrados neste dia"};
}

  const timer=setTimeout(()=>{dbState="O progresso salvo ainda não carregou. Ele aparece assim que a conexão voltar.";if(route==="inicio")render()},10000);
  let first=true;
  db.collection("dias").limit(1000).onSnapshot(s=>{if(!s.metadata||!s.metadata.fromCache){clearTimeout(timer);dbState=db.mode==="firebase"?"Progresso salvo e sincronizado entre celular e computador.":"Modo local: o progresso fica salvo só neste aparelho."}
    for(const ch of s.docChanges()){if(ch.type==="removed")delete DIAS[ch.doc.id];else if(!pend[ch.doc.id])DIAS[ch.doc.id]=ch.doc.data()}
    first=false;const ae=document.activeElement;if(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT"&&ae.type!=="checkbox"))return;render()},()=>{clearTimeout(timer);dbState="Não foi possível ler o progresso salvo agora.";render()});
  db.collection("erros").limit(1000).onSnapshot(s=>{ERROS.clear();s.docs.forEach(d=>{if(d.exists)ERROS.set(d.id,d.data())});if(route==="erros"||route==="inicio")render()},()=>{});
  db.collection("progresso").limit(1000).onSnapshot(s=>{Object.keys(PROG).forEach(k=>delete PROG[k]);s.docs.forEach(d=>{if(d.exists)PROG[d.id]=true});if(["edital","hoje"].includes(route))render()},()=>{});
})();
</script>
</body>
</html>
